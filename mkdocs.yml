site_name: GeoSoft
site_description: Dokumentace programu GeoSoft pro geodetické výpočty
site_url: https://kovarmi9.github.io/GeoSoft/

theme:
  name: material
  language: cs
  features:
    - navigation.tabs        # hlavní části jako záložky nahoře
    - navigation.indexes     # klik na záložku otevře úvodní stránku části
    - navigation.top         # tlačítko "nahoru" při dlouhé stránce
    - search.highlight       # zvýrazní hledané slovo na stránce
    - content.code.copy      # tlačítko pro kopírování ukázky kódu

markdown_extensions:
  - admonition               # rámečky Poznámka / Pozor
  - def_list                 # seznam pojem : vysvětlení
  - tables
  - toc:
      permalink: true        # odkaz na každý nadpis
  - pymdownx.highlight       # barevné zvýraznění kódu
  - pymdownx.superfences

nav:
  - Úvod: index.md
  - Seznam souřadnic:
      - seznam-souradnic/index.md
      - Bod: seznam-souradnic/bod.md
      - Validace: seznam-souradnic/validace.md
      - Seznam bodů: seznam-souradnic/seznam-bodu.md
      - Ukládání: seznam-souradnic/ukladani.md
      - Import a export: seznam-souradnic/import-export.md
      - Pořadí souřadnic: seznam-souradnic/poradi-souradnic.md
      - Čísla bodů: seznam-souradnic/cisla-bodu.md
      - Formulář: seznam-souradnic/formular.md
      - Přidat bod: seznam-souradnic/pridat-bod.md
  - Geodetické výpočty:
      - vypocty/index.md
      - Polární metoda: vypocty/polarni-metoda.md
      - Ortogonální metoda: vypocty/ortogonalni-metoda.md
      - Konstrukční oměrné: vypocty/konstrukcni-omerne.md
      - Kontrolní oměrné: vypocty/kontrolni-omerne.md
      - Výpočet výměry: vypocty/vymera.md
      - Transformace: vypocty/transformace.md
  - Nastavení: nastaveni.md
  - Protokol: protokol.md
  - Datová struktura:
      - geodataframe/index.md
      - Řádek TGeoRow: geodataframe/georow.md
      - Tabulka TGeoDataFrame: geodataframe/geodataframe.md
  - Komponenty:
      - komponenty/index.md
      - TGeoGrid: komponenty/geogrid.md
      - TGeoFieldsGrid: komponenty/geofieldsgrid.md
      - Kontrola zadávání: komponenty/kontrola-zadavani.md
